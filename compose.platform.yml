name: clinical-form-platform
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: formplatform
      POSTGRES_USER: formplatform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formplatform -d formplatform"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  platform-postgres:
